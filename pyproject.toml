[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "gum-code"
version = "0.1.0"
description = "A local CLI coding agent harness."
requires-python = ">=3.11"
dependencies = [
    "openai>=1",
    "python-dotenv>=1",
    "prompt-toolkit>=3.0.52,<4",
    "rich>=14,<15",
    "tokenizers>=0.22,<0.24",
]


[project.scripts]
gum-code = "gum_code.cli:main"


[tool.setuptools.packages.find]
where = ["src"]
